<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 894" role="img" aria-labelledby="title desc"><title id="title">Constellation Instance: ecosystem and project map</title><desc id="desc">One selected-engine implementation of Agent Instance, with its own identity and lifecycle. Role highlights show scope, not certification. Each project or part appears once. Internal parts are grouped in this repository; collaborators remain outside. Constellation Instance contains Identity and private state. Constellation Instance contains Management and lifecycle. Constellation Instance contains ACP attach boundary. ACP attach boundary uses Selected ACP engine. Constellation Instance integrates Independent connectors.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#76523b" stroke-width="1.5"/></marker></defs><rect width="1200" height="894" rx="18" fill="#fff7ee"/><g font-family="Trebuchet MS,Arial,sans-serif"><text x="35" y="36" text-anchor="start" font-size="20" fill="#382316">Constellation · ecosystem locator</text><rect x="30" y="58" width="210" height="58" rx="12" fill="#3e6753" stroke="#3e6753" stroke-width="2"/><text x="135" y="94" text-anchor="middle" font-size="18" fill="#fff7ee">Agent Instance</text><rect x="265" y="58" width="210" height="58" rx="12" fill="#fff7ee" stroke="#d7bfa8" stroke-width="2"/><text x="370" y="94" text-anchor="middle" font-size="18" fill="#382316">Conversation</text><rect x="500" y="58" width="210" height="58" rx="12" fill="#fff7ee" stroke="#d7bfa8" stroke-width="2"/><text x="605" y="94" text-anchor="middle" font-size="18" fill="#382316">Connection</text><rect x="735" y="58" width="210" height="58" rx="12" fill="#fff7ee" stroke="#d7bfa8" stroke-width="2"/><text x="840" y="94" text-anchor="middle" font-size="18" fill="#382316">Experience</text><rect x="970" y="58" width="210" height="58" rx="12" fill="#fff7ee" stroke="#d7bfa8" stro