[package]
name = "agent-instance"
version = "0.16.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/microsoft/amplifier-constellation-instance"
description = "Independent installed agent identity, setup, profiles, authorized context, work, and observability."

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
dunce = "1"
futures-util = "0.3"
get_if_addrs = "0.5"
libc = "0.2"
rand = "0.8"
rcgen = { version = "0.14", features = ["x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
x509-parser = "0.18"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
pam-client = { version = "0.5.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
